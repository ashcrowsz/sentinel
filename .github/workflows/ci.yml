name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: lint
        run: ruff check . && ruff format --check .
      - name: types
        run: mypy src
        continue-on-error: true  # strict mode is being rolled in module by module
      - name: tests
        run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentinel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sentinel:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
