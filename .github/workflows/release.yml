name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Workload Identity Federation: no long-lived GCP keys in GitHub

env:
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/sentinel/sentinel

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: replay eval subset
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: python -m evals.run_review_eval --cases evals/cases --out evals/results --gate

  publish:
    needs: eval-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker $REGISTRY --quiet
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  bump-gitops:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/sentinel-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: bump image tag
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' envs/prod/values.yaml
          git config user.name "sentinel-release"
          git config user.email "release@users.noreply.github.com"
          git commit -am "sentinel: deploy ${{ github.sha }}"
          git push
