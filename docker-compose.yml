services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis, postgres]

  worker:
    build: .
    env_file: .env
    command: ["arq", "sentinel.worker.WorkerSettings"]
    depends_on: [redis, postgres]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm.yaml"]
    volumes: ["./deploy/litellm.yaml:/etc/litellm.yaml:ro"]
    ports: ["4000:4000"]
