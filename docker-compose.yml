x-app: &app
  build: .
  env_file: .env
  environment:
    # inside the compose network, services are reached by name, not localhost
    REDIS_URL: redis://redis:6379/0
    LITELLM_BASE_URL: http://litellm:4000
    LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env, see .env.example}
    GITHUB_PRIVATE_KEY_PATH: /app/secrets/sentinel.private-key.pem
  volumes: ["./secrets:/app/secrets:ro"]
  depends_on: [redis, litellm]

services:
  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["arq", "sentinel.worker.WorkerSettings"]
    healthcheck: { disable: true }  # the image's check polls the API port; the worker has none

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    # LITELLM_CONFIG=litellm.local.yaml -> LM Studio on your machine ($0)
    # LITELLM_CONFIG=litellm.yaml       -> hosted Claude (needs ANTHROPIC_API_KEY)
    command: ["--config", "/etc/litellm/${LITELLM_CONFIG:-litellm.local.yaml}", "--port", "4000"]
    volumes: ["./deploy:/etc/litellm:ro"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env, see .env.example}  # the proxy refuses to start without one
      # Docker Desktop: host.docker.internal works. Docker Engine in WSL: use the Windows
      # host's address on the WSL network (`ip route | awk '/default/{print $3}'`)
      LMSTUDIO_API_BASE: ${LMSTUDIO_API_BASE:-http://host.docker.internal:1234/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["4000:4000"]
