apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/ashcrowsz/sentinel.git
      targetRevision: main
      path: deploy/helm/sentinel
      helm:
        valueFiles: [$values/envs/prod/values.yaml]
    - repoURL: https://github.com/ashcrowsz/sentinel-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
