apiVersion: v1
kind: ServiceAccount
metadata: { name: sentinel }
automountServiceAccountToken: false
{{- range $name, $cfg := dict "api" .Values.api "worker" .Values.worker }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-{{ $name }}
  labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: {{ $name }} }
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: {{ $name }} }
    spec:
      serviceAccountName: sentinel
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $name "worker" }}
          command: ["arq", "sentinel.worker.WorkerSettings"]
          {{- else }}
          ports: [{ containerPort: 8000, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          {{- end }}
          envFrom:
            - secretRef: { name: sentinel-secrets }
          env:
            - { name: REDIS_URL, value: {{ $.Values.redisUrl | default "redis://sentinel-redis:6379/0" | quote }} }
            - { name: GITHUB_PRIVATE_KEY_PATH, value: /app/secrets/sentinel.private-key.pem }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: OTEL_SERVICE_NAME, value: "sentinel-{{ $name }}" }
            {{- range $k, $v := $.Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          volumeMounts:
            - { name: github-key, mountPath: /app/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: github-key
          secret: { secretName: sentinel-github-key, optional: true }
        - name: tmp
          emptyDir: {}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: sentinel-api }
spec:
  selector: { app.kubernetes.io/name: sentinel, app.kubernetes.io/component: api }
  ports: [{ port: 80, targetPort: http, name: http }]
