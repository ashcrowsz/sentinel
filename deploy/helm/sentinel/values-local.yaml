# $0 local cluster (kind). Image is built locally and loaded with `kind load docker-image`.
image:
  repository: sentinel
  tag: local
  pullPolicy: Never

api:
  replicas: 1

env:
  SENTINEL_MODEL: reviewer
  SENTINEL_REASONING_EFFORT: none
  # LiteLLM from the compose stack, via the kind network gateway (Docker Engine in WSL).
  # With Docker Desktop use http://host.docker.internal:4000 instead
  LITELLM_BASE_URL: http://172.18.0.1:4000

# create the secrets by hand instead (kubectl create secret generic ...)
externalSecret:
  enabled: false
