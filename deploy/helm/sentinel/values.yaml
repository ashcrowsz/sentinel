image:
  repository: europe-west1-docker.pkg.dev/PROJECT/sentinel/sentinel
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# extra non-secret env for api + worker
env:
  SENTINEL_MODEL: reviewer
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4317

# secrets are synced from GCP Secret Manager by External Secrets Operator
externalSecret:
  enabled: true
  secretStore: gcp-secret-manager
  keys:
    - GITHUB_APP_ID
    - GITHUB_WEBHOOK_SECRET
    - LITELLM_API_KEY

sandbox:
  namespace: sentinel-sandbox
  allowEgressTo: ["140.82.112.0/20"]  # github.com, init container only

# built-in single-replica Redis (templates/redis.yaml); point redisUrl elsewhere for a managed one
redis:
  enabled: true
redisUrl: redis://sentinel-redis:6379/0
