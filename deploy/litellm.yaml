# Hosted setup: same aliases, real Claude behind them. Needs ANTHROPIC_API_KEY.
model_list:
  - model_name: reviewer
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: reviewer
    litellm_params:  # fallback when the primary is rate limited
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: reviewer-quality
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true

router_settings:
  num_retries: 2
  timeout: 120
