<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .bg { fill: #0d1117; }
    .n { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .ok { fill: #12261a; stroke: #3fb950; stroke-width: 1.5; }
    .stop { fill: #2a1a1a; stroke: #f85149; stroke-width: 1.5; }
    .guard { fill: #2a2412; stroke: #d29922; stroke-width: 1.5; }
    .t { fill: #e6edf3; font-size: 14px; font-weight: 600; }
    .s { fill: #8b949e; font-size: 11.5px; }
    .e { stroke: #58a6ff; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: d 1.1s linear infinite; }
    .r { stroke: #d29922; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: d 1.1s linear infinite; }
    @keyframes d { to { stroke-dashoffset: -24; } }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
  </defs>
  <rect class="bg" width="960" height="380" rx="14"/>
  <text x="30" y="38" fill="#e6edf3" font-size="20" font-weight="700">the repair loop · act, verify with code, retry</text>
  <text x="30" y="60" class="s">the tests decide when it's fixed. The model's opinion doesn't count.</text>

  <rect class="n" x="30" y="110" width="130" height="64" rx="10"/>
  <text x="95" y="138" class="t" text-anchor="middle">read_failure</text>
  <text x="95" y="157" class="s" text-anchor="middle">CI job logs</text>

  <rect class="n" x="195" y="110" width="120" height="64" rx="10"/>
  <text x="255" y="138" class="t" text-anchor="middle">locate</text>
  <text x="255" y="157" class="s" text-anchor="middle">via MCP</text>

  <rect class="n" x="350" y="110" width="140" height="64" rx="10"/>
  <text x="420" y="138" class="t" text-anchor="middle">propose_patch</text>
  <text x="420" y="157" class="s" text-anchor="middle">unified diff</text>

  <rect class="guard" x="525" y="110" width="120" height="64" rx="10"/>
  <text x="585" y="138" class="t" text-anchor="middle">guard</text>
  <text x="585" y="157" class="s" text-anchor="middle">no test cheating</text>

  <rect class="n" x="680" y="110" width="120" height="64" rx="10"/>
  <text x="740" y="138" class="t" text-anchor="middle">run_tests</text>
  <text x="740" y="157" class="s" text-anchor="middle">sandbox Job</text>

  <rect class="n" x="835" y="110" width="100" height="64" rx="10"/>
  <text x="885" y="138" class="t" text-anchor="middle">decide</text>
  <text x="885" y="157" class="s" text-anchor="middle">stop?</text>

  <path class="e" d="M160 142 H191" marker-end="url(#b)"/>
  <path class="e" d="M315 142 H346" marker-end="url(#b)"/>
  <path class="e" d="M490 142 H521" marker-end="url(#b)"/>
  <path class="e" d="M645 142 H676" marker-end="url(#b)"/>
  <path class="e" d="M800 142 H831" marker-end="url(#b)"/>

  <path class="r" d="M885 106 C 885 62, 420 62, 420 106" marker-end="url(#o)"/>
  <text x="652" y="99" fill="#d29922" font-size="12" text-anchor="middle">still red, new failure → retry with what didn't work</text>

  <!-- outcomes -->
  <rect class="ok" x="560" y="235" width="380" height="54" rx="10"/>
  <text x="750" y="258" class="t" text-anchor="middle">✅ green → open PR from sentinel/fix-*</text>
  <text x="750" y="277" class="s" text-anchor="middle">a human approves. Never a direct push.</text>

  <rect class="stop" x="30" y="235" width="510" height="110" rx="10"/>
  <text x="50" y="262" class="t">🛑 stop and post a diagnosis instead, when:</text>
  <text x="50" y="287" class="s">• 4 iterations used up</text>
  <text x="50" y="306" class="s">• cost budget hit ($0.50 default)</text>
  <text x="50" y="325" class="s">• same failure fingerprint twice in a row (no progress)</text>
  <text x="290" y="287" class="s">• patch deletes / skips / weakens a test</text>
  <text x="290" y="306" class="s">• patch touches CI config or conftest</text>

  <path class="e" d="M885 174 V231" marker-end="url(#b)"/>
</svg>
