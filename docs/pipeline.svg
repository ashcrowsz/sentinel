nejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.4313;0.4344;0.4562;0.4875;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4313;0.4319;0.4562;0.4656;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.4313;0.4562;1.0000"><mpath href="#rl"/></animateMotion><circle r="7" fill="var(--blue)" stroke="var(--bg)" stroke-width="2.5"/><text class="sub" x="11" y="-10" style="font-weight:700;fill:var(--blue)">one JSON call</text></g><path d="M490,245L490,330" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.4813;0.4844;0.5062;0.5375;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4813;0.4819;0.5062;0.5156;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0.0000;0.4813;0.5062;1.0000"><mpath href="#rl"/></animateMotion><circle r="7" fill="var(--blue)" stroke="var(--bg)" stroke-width="2.5"/></g><path d="M490,245L650,245" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.5250;0.5281;0.5500;0.5813;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5250;0.5256;0.5500;0.5594;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.5250;0.5500;1.0000"><mpath href="#rf"/></animateMotion><circle r="7" fill="var(--blue)" stroke="var(--bg)" stroke-width="2.5"/></g><path d="M650,245L800,245" fill="none" stroke="var(--blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.5875;0.5906;0.6188;0.6500;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5875;0.5881;0.6188;0.6281;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.5875;0.6188;1.0000"><mpath href="#fo"/></animateMotion><circle r="7" fill="var(--blue)" stroke="var(--bg)" stroke-width="2.5"/><text class="sub" x="11" y="-10" style="font-weight:700;fill:var(--blue)">comment</text></g><path d="M350,18L350,62" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.7625;0.7656;0.7937;0.8250;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7625;0.7631;0.7937;0.8031;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0.0000;0.7625;0.7937;1.0000"><mpath href="#xa"/></animateMotion><circle r="7" fill="var(--bad)" stroke="var(--bg)" stroke-width="2.5"/><text class="sub" x="11" y="-10" style="font-weight:700;fill:var(--bad)">forged signature</text></g><path d="M350,18L350,62" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;.9;.9;0;0" keyTimes="0.0000;0.8063;0.8094;0.8375;0.8688;1.0000"/></path><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.8063;0.8069;0.8375;0.8469;1.0000"/><animateMotion dur="16.0s" repeatCount="indefinite" calcMode="linear" keyPoints="1;1;0;0" keyTimes="0.0000;0.8063;0.8375;1.0000"><mpath href="#xa"/></animateMotion><circle r="7" fill="var(--bad)" stroke="var(--bg)" stroke-width="2.5"/></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7937;0.8125;0.9125;0.9313;1.0000"/><text x="398" y="30" style="font-size:14px;font-weight:800;fill:var(--bad)">401 · nothing queued</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6438;0.9625;0.9813;1.0000"/><rect x="730" y="290" width="196" height="160" rx="10" fill="var(--bg)" stroke="var(--line)"/><text class="sub" x="742" y="310" style="font-weight:700;fill:var(--ink)">sentinel[bot] · users.py:6-7</text><text x="742" y="332" style="font-size:13px;font-weight:800;fill:var(--red)">security (high)</text><text class="sub" x="742" y="352">f-string SQL: injectable</text><rect x="742" y="362" width="172" height="76" rx="6" fill="var(--panel)"/><text x="750" y="380" style="font-family:monospace;font-size:10.5px;fill:var(--green)">suggestion</text><text x="750" y="398" style="font-family:monospace;font-size:10.5px">q = "... id = %s"</text><text x="750" y="414" style="font-family:monospace;font-size:10.5px">rows = conn.execute(</text><text x="750" y="430" style="font-family:monospace;font-size:10.5px">    q, (user_id,))</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.0125;0.0312;0.1625;0.1812;1.0000"/><text class="cap" x="40" y="418">1 · a PR opens, the webhook is checked</text><text class="capsub" x="40" y="438">HMAC-SHA256 with the App's secret, then 202 in milliseconds</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.1625;0.1812;0.2812;0.3000;1.0000"/><text class="cap" x="40" y="418">2 · queued, one job per commit</text><text class="capsub" x="40" y="438">a redelivered webhook never reviews the same commit twice</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.2812;0.3000;0.4062;0.4250;1.0000"/><text class="cap" x="40" y="418">3 · parse the diff, gather context</text><text class="capsub" x="40" y="438">only lines the PR added can get a comment · repo context over MCP</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.4062;0.4250;0.5250;0.5438;1.0000"/><text class="cap" x="40" y="418">4 · one structured model call</text><text class="capsub" x="40" y="438">repo text fenced as untrusted: injected instructions get reported</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.5250;0.5438;0.6250;0.6438;1.0000"/><text class="cap" x="40" y="418">5 · the filter keeps only what matters</text><text class="capsub" x="40" y="438">confidence floor, no style nits, suggestion must parse and fit</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6438;0.7562;0.7750;1.0000"/><text class="cap" x="40" y="418">6 · an inline review lands, about 9 s, $0</text><text class="capsub" x="40" y="438">eval on seeded PRs: recall 0.80, zero false positives</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.0000;0.7562;0.7750;0.9625;0.9813;1.0000"/><text class="cap" x="40" y="418">7 · and a forged webhook?</text><text class="capsub" x="40" y="438">wrong signature: 401, the queue never sees it</text></g></svg>